<app-navbar></app-navbar>

<main class="container py-5">
  <div class="row g-5">
    <div class="col-lg-8">
      <h2 class="fw-bold text-primary mb-4">Reseñas de nuestros Clientes</h2>

      <div *ngFor="let c of comentarios()" class="card border-0 shadow-sm rounded-4 p-4 mb-3 bg-white">
        <div class="d-flex align-items-center gap-3 mb-3">
          <div class="bg-primary text-white rounded-circle d-flex align-items-center justify-content-center fw-bold" style="width: 45px; height: 45px;">
            {{c.usuario.charAt(0)}}
          </div>
          <div>
            <h6 class="mb-0 fw-bold">{{c.usuario}}</h6>
            <div class="text-warning small">
              <i *ngFor="let s of getEstrellas(c.estrellas)" class="bi bi-star-fill me-1"></i>
            </div>
          </div>
          <span class="ms-auto text-muted extra-small">{{c.fecha | date:'shortDate'}}</span>
        </div>
        <p class="mb-0 text-secondary">"{{c.texto}}"</p>
      </div>

      <div *ngIf="comentarios().length === 0" class="text-center py-5">
        <p class="text-muted">Aún no hay reseñas aprobadas. ¡Sé el primero!</p>
      </div>
    </div>

    <div class="col-lg-4">
      <div class="card border-0 shadow-lg rounded-4 p-4 sticky-top" style="top: 100px;">
        <h4 class="fw-bold mb-4 text-primary">Danos tu opinión</h4>

        <form (ngSubmit)="enviarComentario()">
          <div class="mb-3">
            <label class="form-label small fw-bold">Calificación</label>
            <select class="form-select" [(ngModel)]="nuevoComentario.calificacion" name="stars">
              <option value="5">⭐⭐⭐⭐ (Excelente)</option>
              <option value="4">⭐⭐⭐⭐ (Muy Bueno)</option>
              <option value="3">⭐⭐⭐ (Regular)</option>
              <option value="2">⭐⭐ (Malo)</option>
              <option value="1">⭐ (Muy Malo)</option>
            </select>
          </div>
          <div class="mb-4">
            <label class="form-label small fw-bold">Tu comentario</label>
            <textarea class="form-control" rows="4" placeholder="Cuéntanos tu experiencia..." [(ngModel)]="nuevoComentario.comentario" name="text" required></textarea>
          </div>
          <button type="submit" class="btn btn-warning w-100 py-3 rounded-pill fw-bold shadow-sm" [disabled]="enviando()">
            <span *ngIf="!enviando()">PUBLICAR RESEÑA</span>
            <span *ngIf="enviando()" class="spinner-border spinner-border-sm"></span>
          </button>
          <p *ngIf="!authService.estaAutenticado()" class="text-center text-muted small mt-3">
            Inicia sesión para poder comentar.
          </p>
        </form>
      </div>
    </div>
  </div>
</main>

<app-footer></app-footer>

<!-- Modal de Feedback -->
<div class="modal fade" id="feedbackModal" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content border-0 rounded-4 shadow">
      <div class="modal-header border-0" [class.bg-success]="isSuccess" [class.bg-danger]="!isSuccess">
        <h5 class="modal-title fw-bold text-white">{{feedbackTitle}}</h5>
        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body p-4 text-center">
        <i class="bi fs-1 mb-3 d-block" [class.bi-check-circle-fill]="isSuccess" [class.bi-x-circle-fill]="!isSuccess" [class.text-success]="isSuccess" [class.text-danger]="!isSuccess"></i>
        <p class="mb-0 fw-medium">{{feedbackMessage}}</p>
      </div>
      <div class="modal-footer border-0">
        <button type="button" class="btn rounded-pill px-4" [class.btn-success]="isSuccess" [class.btn-danger]="!isSuccess" data-bs-dismiss="modal">Cerrar</button>
      </div>
    </div>
  </div>
</div>
